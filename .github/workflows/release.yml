name: release

# The secret of LispM Mail's Google client ID is kept out of its source:
# each release gets it as lispm-mail-secrets.eld, written from the
# repository's secret GOOGLE_CLIENT_SECRET, and the App Store puts that
# file beside LispM Mail, its catalog pinning the file's SHA-256.

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: The release to attach the file to
        required: true

permissions:
  contents: write

jobs:
  secrets:
    name: Secrets file
    runs-on: ubuntu-latest
    env:
      TAG: ${{ github.event.release.tag_name || inputs.tag }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.TAG }}
      - uses: purcell/setup-emacs@v8.0
        with:
          version: '31.1'
      - name: Write lispm-mail-secrets.eld
        env:
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
        run: make secrets
      - name: Attach it to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "$TAG" lispm-mail-secrets.eld --clobber
          echo "lispm-mail-secrets.eld SHA-256: \`$(sha256sum lispm-mail-secrets.eld | cut -d ' ' -f 1)\`" >> "$GITHUB_STEP_SUMMARY"
